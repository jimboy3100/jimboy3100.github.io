    <!-- Texts in the language chosen in Legend Mod (built from developers/i18n/src): lm-i18n.js writes the
         chosen language's file right after itself; English (lm-en.js) is the fallback for missing texts.
         These two stay parser-blocking on purpose (not async / defer): the scripts after them read the texts
         while they run, not later. LMexpress/i18n.js copies agar.io's texts at once, ogario.v4.js builds its
         labels (textLanguage) as it is parsed and builds the menus at its end (Settings.init, application.init).
         Waiting for them would mean holding back every later script of this page, LMexpress.js too, and the
         installed 1.8 userscripts call init() unguarded right after the page's scripts: with no init yet
         Legend Mod would not start for them (the 1.9 loaders would count a failed start and drop their saved
         page). Nor would it be sooner: the next scripts need the texts. The synchronous requests below run
         only when one of the two files did not come. -->
    <script src="https://www.legendmod.ml/languages/lm-i18n.js?v=3.708" charset="utf-8"></script>
    <script src="https://www.legendmod.ml/languages/lm-en.js?v=3.708" charset="utf-8"></script>
    <script>
        /* On agar.io this page is written with document.write and Chrome may refuse such scripts. The runtime and
         * the English texts (the fallback of every text, read while the mod starts) then come synchronously; the
         * chosen language comes asynchronously and is applied when it is there, like a language picked in the
         * menu (LMi18n.setLang: texts, old globals, the menus). Nothing happens when they are there. */
        (function () {
            var en = document.querySelector('script[src*="/languages/lm-en.js"]');
            var q = en ? (/\?v=[^&#]+/.exec(en.src) || [''])[0] : '';
            var need = function (file) {
                try {
                    var x = new XMLHttpRequest();
                    x.open('GET', 'https://www.legendmod.ml/languages/' + file + q, false);
                    x.send();
                    if (x.status !== 200) return;
                    var s = document.createElement('script');
                    s.text = x.responseText;
                    (document.head || document.documentElement).appendChild(s);
                } catch (e) { }
            };
            if (!window.LMi18n) need('lm-i18n.js');
            var L = window.LMi18n;
            if (!L) return;
            if (!L.loaded('en')) need('lm-en.js');
            var c = L.lang();
            /* the menus filled by id (languages/LanguagePackHandler.js) too, when it ran before the file came */
            if (c !== 'en' && !L.loaded(c)) L.setLang(c, { save: false, force: true }, function () {
                if (typeof window.lmApplyLanguagePack === 'function') { try { window.lmApplyLanguagePack(); } catch (e) { } }
            });
        })();
    </script>
