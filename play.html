    <script>
        (function () {
            var boot = document.getElementById('lm-boot'), bar = document.getElementById('lm-boot-bar');
            var text = document.getElementById('lm-boot-text'), file = document.getElementById('lm-boot-file');
            var el = (navigator.language || '').slice(0, 2) === 'el';
            text.textContent = el ? 'Φόρτωση... παρακαλώ περιμένετε' : 'Loading... please wait';
            /* the player's own menu colours, when saved */
            try {
                var th = JSON.parse(localStorage.getItem('ogarioThemeSettings') || '{}');
                if (/^#[0-9a-f]{3,8}$/i.test(th.menuPanelColor || '')) boot.style.background = th.menuPanelColor;
                if (/^#[0-9a-f]{3,8}$/i.test(th.menuMainColor || '')) bar.style.background = th.menuMainColor;
            } catch (e) { }
            /* the number of scripts the last load had (the first load guesses) */
            var total = 40, done = 0, failed = 0, gone = false;
            try { total = +localStorage.getItem('lmBootScripts') || 40; } catch (e) { }
            var name = function (src) { return String(src || '').split(/[?#]/)[0].split('/').pop(); };
            var onLoad = function (e) {
                var t = e.target;
                if (gone || !t || t.tagName !== 'SCRIPT' || !t.src) return;
                done++;
                if (e.type === 'error') failed++;
                bar.style.width = Math.min(95, 3 + 92 * done / total) + '%';
                file.textContent = (e.type === 'error' ? '! ' : '') + name(t.src) + ' (' + done + ')';
            };
            document.addEventListener('load', onLoad, true);
            document.addEventListener('error', onLoad, true);
            var hide = function () {
                if (gone) return;
                gone = true;
                document.removeEventListener('load', onLoad, true);
                document.removeEventListener('error', onLoad, true);
                bar.style.width = '100%';
                boot.style.opacity = '0';
                setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 450);
            };
            window._lmBootHide = hide;
            /* every script of the page has run: wait for the menu (the mod builds it), at most 15 s */
            document.addEventListener('DOMContentLoaded', function () {
                try { if (done > 5 && !failed) localStorage.setItem('lmBootScripts', String(done)); } catch (e) { }
                var tries = 0, wait = setInterval(function () {
                    if (document.getElementById('main-menu') || ++tries > 150) { clearInterval(wait); hide(); }
                }, 100);
            });
            /* never stays for good (a stuck load still shows what the page has) */
            setTimeout(hide, 90000);
        })();
    </script>

    <script>
        /* P2P WebSocket proxy: hash:// server addresses go through delt.io's P2PWebSocket */
        (function () {
            var OrigWS = window.WebSocket;
            var hashPattern = /\/\/([a-z0-9]{20,30})(?:[:/]|$)/;
            window.WebSocket = new Proxy(OrigWS, {
                construct: function (target, args, newTarget) {
                    var url = String(args[0]);
                    var protocols = args[1];
                    var hashMatch = url.match(hashPattern);
                    if (hashMatch && !/cloud/.test(url) && typeof P2PWebSocket !== 'undefined') {
                        console.log('[P2P] Intercepting hash connection:', url);
                        /* P2PWebSocket's own address format, not a plain-http request */
                        var socket = new P2PWebSocket('http://' + hashMatch[1], protocols);

                        /*
                         * Protocol state belongs to this specific socket.
                         * Never mutate global legendmod.integrity from asynchronous socket events.
                         */
                        socket._lwIntegrity = false;
                        socket._lwTransportType = "p2p";

                        return socket;
                    }
                    return Reflect.construct(target, args, newTarget);
                }
            });
        })();
    </script>
