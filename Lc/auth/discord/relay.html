<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Login - Completing...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0e17;
      color: #c8d6e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #111827;
      border-radius: 12px;
      padding: 40px;
      border: 1px solid #1e293b;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h2 { color: #5865F2; margin-bottom: 8px; }
    .status { color: #64748b; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #5865F2;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1em;
    }
    .error { color: #f87171; }
    .info { color: #64748b; font-size: 0.85em; margin-top: 16px; }
    #debug { text-align: left; font-family: monospace; font-size: 11px; color: #4ade80;
             background: #0d1117; padding: 12px; border-radius: 8px; margin-top: 16px;
             max-height: 200px; overflow-y: auto; white-space: pre-wrap; display: none; }
  </style>

    <!-- ═══ SEO: Auto-added metadata ═══ -->
    <meta name="description" content="Closing this window...">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://www.legendmod.ml/Lc/auth/discord/relay.html">
    <meta property="og:site_name" content="Legend Mod">
    <meta property="og:title" content="Discord Login - Completing...">
    <meta property="og:description" content="Closing this window...">
    <meta property="og:url" content="https://www.legendmod.ml/Lc/auth/discord/relay.html">
    <meta property="og:image" content="https://jimboy3100.github.io/banners/agario1200x630.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Discord Login - Completing...">
    <meta name="twitter:description" content="Closing this window...">
    <meta name="twitter:image" content="https://jimboy3100.github.io/banners/agario1200x630.png">
    <!-- texts in the visitor's language (Legend Mod's language packs, developers/i18n) -->
    <script src="https://www.legendmod.ml/lib/lm-i18n.js" data-areas="site-lc-auth" charset="utf-8"></script>
</head>
<body>
  <div class="card">
    <img data-i18n-alt="site.lc.auth.legendmod" src="https://jimboy3100.github.io/banners/icon128croped.gif" alt="LegendMod" style="width:64px;height:64px;margin-bottom:16px;border-radius:12px;">
    <div id="success">
      <h2 data-i18n="site.lc.auth.discordLinked">✅ Discord Linked!</h2>
      <p data-i18n="site.lc.auth.closingThisWindow" class="status">Closing this window...</p>
      <p data-i18n-html="site.lc.auth.ifThisWindowDoesn" class="info">If this window doesn't close, <a href="javascript:window.close()" class="btn" style="padding:8px 16px;font-size:0.9em">Close Window</a></p>
    </div>
    <div id="error-msg" style="display:none">
      <h2 data-i18n="site.lc.auth.loginFailed" class="error">Login Failed</h2>
      <p class="status" id="error-text"></p>
      <br>
      <a data-i18n="site.lc.auth.backToGame" href="https://expanding.land" class="btn">Back to Game</a>
    </div>
    <div id="debug"></div>
  </div>

  <script>
    var debugEl = document.getElementById('debug');
    function dbg(msg) {
      console.log('[RELAY] ' + msg);
      debugEl.textContent += msg + '\n';
    }

    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var code = urlParams.get('code');

      if (!code) {
        document.getElementById('success').style.display = 'none';
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('error-text').textContent = window.lmT ? lmT('site.lc.auth.noCode') : 'No authorization code received.'; // i18n-ok: English when the language file could not load
        return;
      }

      dbg('Relay page loaded on origin: ' + window.location.origin);
      dbg('Code length: ' + code.length);

      /* Build Discord user data with the code as token */
      var discordData = {
        id: 'discord_' + code.substring(0, 16),
        username: 'Discord User',
        globalName: 'Discord User',
        avatar: '',
        email: '',
        token: code
      };
      var msg = { type: 'legendmod_discord_login', data: discordData };

      /* Method 1: BroadcastChannel — works if play.html is accessed directly (same origin, same partition) */
      try {
        var bc = new BroadcastChannel('legendmod_discord');
        bc.postMessage(msg);
        dbg('BroadcastChannel sent!');
        bc.close();
      } catch(e) {
        dbg('BroadcastChannel failed: ' + e.message);
      }

      /* Method 2: localStorage — works if same origin AND same storage partition */
      try {
        localStorage.setItem('legendmod_discord', JSON.stringify(discordData));
        dbg('localStorage SET OK');
      } catch(e) {
        dbg('localStorage failed: ' + e.message);
      }

      /* Method 3: postMessage to opener — the popup was opened from play.html.
       * If the opener reference survived the cross-origin redirect chain
       * (discord.com → expanding.land → jimboy3100.github.io), this works.
       * The message carries the one-time OAuth code, so it is posted only to our
       * own origins (never '*'): a window or iframe of any other origin gets nothing. */
      var trustedOrigins = ['https://expanding.land', 'https://jimboy3100.github.io', 'https://legendmod.ml'];
      function postToTrusted(target) {
        for (var t = 0; t < trustedOrigins.length; t++) {
          try { target.postMessage(msg, trustedOrigins[t]); } catch (e3) { }
        }
      }
      if (window.opener) {
        try {
          postToTrusted(window.opener);
          dbg('postMessage sent to opener!');

          /* Method 4: The opener might be expanding.land which embeds play.html in an iframe.
           * Try to postMessage into each iframe inside the opener (trusted origins only). */
          try {
            var frames = window.opener.frames;
            for (var i = 0; i < frames.length; i++) {
              postToTrusted(frames[i]);
            }
            dbg('postMessage sent to ' + frames.length + ' iframe(s) in opener');
          } catch(e2) {
            dbg('Could not access opener iframes (cross-origin): ' + e2.message);
          }
        } catch(e) {
          dbg('postMessage to opener failed: ' + e.message);
        }
      } else {
        dbg('window.opener is null — using localStorage/BroadcastChannel fallback only');
      }

      /* Auto-close after 1.5 seconds */
      setTimeout(function() {
        dbg('Closing popup...');
        window.close();
      }, 1500);
    })();
  </script>
</body>
</html>
